<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cross-Origin-Opener-Policy" content="same-origin">
  <meta http-equiv="Cross-Origin-Embedder-Policy" content="require-corp">
  <title>Factory Sim</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #111; font-family: monospace; }
    #game-container { position: relative; width: 100%; height: 100%; }
    #game-canvas { display: block; width: 100%; height: 100%; }
    #ui-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; }
    #ui-layer > * { pointer-events: auto; }
    #hud { position: absolute; top: 12px; left: 12px; color: #0f0; font-size: 13px; line-height: 1.6; text-shadow: 0 0 4px #000; }
    #toolbar { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); display: flex; flex-direction: column; gap: 4px; }
    .tool-btn { width: 48px; height: 48px; background: rgba(0,0,0,0.7); border: 1px solid #555; color: #ccc; font-size: 10px; cursor: pointer; display: flex; align-items: center; justify-content: center; border-radius: 4px; }
    .tool-btn:hover, .tool-btn.active { border-color: #0f0; color: #0f0; }
    #tooltip { position: absolute; display: none; background: rgba(10,10,10,0.92); border: 1px solid #0f0; color: #ccc; font-size: 12px; padding: 8px 12px; border-radius: 4px; white-space: pre; pointer-events: none; z-index: 100; max-width: 320px; }
    #minimap { position: absolute; bottom: 12px; right: 12px; width: 160px; height: 160px; border: 1px solid #555; background: rgba(0,0,0,0.6); }
  </style>
  <script type="module" crossorigin src="/assets/index-BWHXgdDh.js"></script>
</head>
<body>
  <div id="game-container">
    <canvas id="game-canvas"></canvas>
    <div id="ui-layer">
      <div id="hud"></div>
      <div id="toolbar">
        <button class="tool-btn active" data-tool="select" title="Select / Inspect">SEL</button>
        <button class="tool-btn" data-tool="miner" title="Mining Drill">MINE</button>
        <button class="tool-btn" data-tool="belt" title="Conveyor Belt">BILT</button>
        <button class="tool-btn" data-tool="smelter" title="Smelter">SMELT</button>
        <button class="tool-btn" data-tool="assembler" title="Assembler">ASSM</button>
        <button class="tool-btn" data-tool="pole" title="Power Pole">PWR</button>
        <button class="tool-btn" data-tool="generator" title="Steam Generator">GEN</button>
        <button class="tool-btn" data-tool="eraser" title="Eraser">ERSE</button>
      </div>
      <div id="tooltip"></div>
      <canvas id="minimap"></canvas>
    </div>
  </div>
</body>
</html>
